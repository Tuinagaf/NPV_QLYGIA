version: '3.8'

services:
  web:
    build: .
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn --bind 0.0.0.0:80 qlygia.wsgi:application"
    volumes:
      - sqlite_data:/app/data
      - static_volume:/app/staticfiles
    ports:
      - "80:80"
    env_file:
      - .env

volumes:
  sqlite_data:
  static_volume:
