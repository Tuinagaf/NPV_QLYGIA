services:
  web:
    build: .
    command: gunicorn qlygia.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "80:8000"  # Map port 80 of EC2 to port 8000 of container
    environment:
      - SECRET_KEY=django-production-secret-key-npv-qlygia-2026
      - DEBUG=False
      - ALLOWED_HOSTS=*
