services:
  web:
    build: .
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate && gunicorn qlygia.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2"
    volumes:
      - .:/app
    ports:
      # Chỉ lắng nghe nội bộ trên máy chủ, KHÔNG mở ra internet trực tiếp.
      # Nginx sẽ là cổng duy nhất tiếp nhận từ internet (port 80 và 443).
      - "127.0.0.1:8000:8000"
    environment:
      - SECRET_KEY=django-production-secret-key-npv-qlygia-2026
      - DEBUG=False
      - ALLOWED_HOSTS=*
