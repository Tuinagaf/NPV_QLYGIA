{% extends 'core/base.html' %}

{% block content %}
<h1>Bảng Điều Khiển</h1>
<p style="color: var(--text-muted); margin-bottom: 30px;">Tổng quan dữ liệu hệ thống</p>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; margin-top: 20px;">
    <div class="glass-card stat-card" style="position: relative; overflow: hidden;">
        <div style="position: absolute; top: -20px; right: -20px; width: 100px; height: 100px; background: rgba(59, 130, 246, 0.1); border-radius: 50%; filter: blur(20px);"></div>
        <h3 style="margin: 0; color: var(--text-muted); font-size: 1rem; text-transform: uppercase; letter-spacing: 1px;">Tổng Đối Tác</h3>
        <p style="font-size: 3rem; font-weight: 800; margin: 15px 0 0; color: #3b82f6; text-shadow: 0 4px 10px rgba(59,130,246,0.2);">{{ total_partners }}</p>
    </div>
    <div class="glass-card stat-card" style="position: relative; overflow: hidden;">
        <div style="position: absolute; top: -20px; right: -20px; width: 100px; height: 100px; background: rgba(16, 185, 129, 0.1); border-radius: 50%; filter: blur(20px);"></div>
        <h3 style="margin: 0; color: var(--text-muted); font-size: 1rem; text-transform: uppercase; letter-spacing: 1px;">Tổng Tuyến Xe</h3>
        <p style="font-size: 3rem; font-weight: 800; margin: 15px 0 0; color: #10b981; text-shadow: 0 4px 10px rgba(16,185,129,0.2);">{{ total_routes }}</p>
    </div>
    <div class="glass-card stat-card" style="position: relative; overflow: hidden;">
        <div style="position: absolute; top: -20px; right: -20px; width: 100px; height: 100px; background: rgba(245, 158, 11, 0.1); border-radius: 50%; filter: blur(20px);"></div>
        <h3 style="margin: 0; color: var(--text-muted); font-size: 1rem; text-transform: uppercase; letter-spacing: 1px;">Giá Cơ Sở</h3>
        <p style="font-size: 3rem; font-weight: 800; margin: 15px 0 0; color: #f59e0b; text-shadow: 0 4px 10px rgba(245,158,11,0.2);">{{ total_prices }}</p>
    </div>
    <div class="glass-card stat-card" style="position: relative; overflow: hidden;">
        <div style="position: absolute; top: -20px; right: -20px; width: 100px; height: 100px; background: rgba(139, 92, 246, 0.1); border-radius: 50%; filter: blur(20px);"></div>
        <h3 style="margin: 0; color: var(--text-muted); font-size: 1rem; text-transform: uppercase; letter-spacing: 1px;">Báo Giá</h3>
        <p style="font-size: 3rem; font-weight: 800; margin: 15px 0 0; color: #8b5cf6; text-shadow: 0 4px 10px rgba(139,92,246,0.2);">{{ total_quotations }}</p>
    </div>
</div>

<style>
    .stat-card {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border: 1px solid rgba(255,255,255,0.8);
        background: rgba(255,255,255,0.85);
    }
    .stat-card:hover {
        transform: translateY(-8px) scale(1.02);
        box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1);
        background: rgba(255,255,255,1);
    }
</style>
{% endblock %}
