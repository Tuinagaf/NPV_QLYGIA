name: Deploy to AWS EC2

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup SSH & Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Bước 1: Cài Docker nếu chưa có
            if ! command -v docker &> /dev/null; then
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ubuntu
            fi

            # Bước 2: Cài docker-compose plugin nếu chưa có
            if ! docker compose version &> /dev/null; then
              sudo apt-get update -y
              sudo apt-get install -y docker-compose-plugin
            fi

            # Bước 3: Clone repo lần đầu, hoặc cập nhật nếu đã có
            if [ ! -d "$HOME/NPV_QLYGIA" ]; then
              git clone https://github.com/Tuinagaf/NPV_QLYGIA.git $HOME/NPV_QLYGIA
            else
              cd $HOME/NPV_QLYGIA
              git fetch origin
              git reset --hard origin/master
            fi

            cd $HOME/NPV_QLYGIA

            # Bước 4: Dừng container cũ, build & khởi chạy lại
            # Dùng 'docker compose' (plugin mới, KHÔNG có gạch ngang)
            docker compose down || true
            docker compose up -d --build
            docker compose exec -T web python manage.py migrate
            docker compose exec -T web python manage.py collectstatic --noinput
            docker compose exec -T web sh -c "DJANGO_SUPERUSER_PASSWORD=admin python manage.py createsuperuser --noinput --username admin --email admin@example.com || true"
